<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto IA Scuola</title>
  
  <!-- Inclusione delle librerie stabili ufficiali -->
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background-color: #0a0a0c;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; font-family: sans-serif; color: white;
      overflow: hidden;
    }
    #canvas-container {
      border: 4px solid #00ffcc;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.3);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    let video;
    let handPose;
    let hands = [];
    let modelloPronto = false;

    // Struttura asincrona per evitare blocchi del browser
    async function setup() {
      let canvas = createCanvas(640, 480);
      canvas.parent('canvas-container');
      
      // 1. Attivazione immediata della webcam
      video = createCapture(VIDEO, { flipped: true });
      video.size(640, 480);
      video.hide();
      
      // 2. Caricamento forzato dell'IA di Google
      print("Caricamento modello...");
      handPose = await ml5.handPose();
      print("Modello Pronto!");
      modelloPronto = true;
      
      // 3. Avvio scansione fotogrammi
      handPose.detectStart(video, gotHands);
    }

    function gotHands(results) {
      hands = results;
    }

    function draw() {
      // Schermata di caricamento nativa controllata dallo stato del programma
      if (!modelloPronto) {
        background(15, 15, 20);
        fill(0, 255, 200);
        textSize(20);
        textAlign(CENTER, CENTER);
        text("SBLOCCO WEBCAM IN CORSO... ⏳\n\nClicca su 'Consenti' nel fumetto in alto!", width / 2, height / 2);
        return;
      }

      // Effetto persistenza scia neon
      background(0, 0, 0, 25);
      
      // Mostra la webcam specchiata
      image(video, 0, 0, width, height);

      // Lettura dei punti geometrici
      if (hands.length > 0) {
        let coordinateRilevate = [];

        for (let i = 0; i < hands.length; i++) {
          let hand = hands[i];
          
          // Estrazione nativa del punto dell'indice secondo i nuovi standard ml5
          let indice = hand.index_finger_tip;
          
          if (indice) {
            coordinateRilevate.push({ x: indice.x, y: indice.y });

            // --- EFFETTO 1: Cerchi concentrici animati arcobaleno ---
            noFill();
            strokeWeight(4);
            colorMode(HSB);
            stroke((frameCount * 3 + i * 120) % 360, 90, 100); 
            
            for (let j = 1; j <= 3; j++) {
              let diametro = (frameCount * 4 + j * 35) % 160;
              ellipse(indice.x, indice.y, diametro, diametro);
            }
            colorMode(RGB);
          }
        }

        // --- EFFETTO 2: Collegamento elastico tra due mani ---
        if (coordinateRilevate.length === 2) {
          stroke(0, 255, 230);
          strokeWeight(3);
          
          let m1 = coordinateRilevate[0];
          let m2 = coordinateRilevate[1];

          for (let k = 0; k <= 10; k++) {
            let t = k / 10;
            let oscillazione = sin(frameCount * 0.12 + k) * 55; 
            
            let startX = lerp(m1.x, m2.x, t) + oscillazione;
            let startY = lerp(m1.y, m2.y, t) - oscillazione;
            let endX = lerp(m1.x, m2.x, (k + 1) / 10) - oscillazione;
            let endY = lerp(m1.y, m2.y, (k + 1) / 10) + oscillazione;
            
            line(startX, startY, endX, endY);
          }
        }
      }
    }
  </script>
</body>
</html>
