<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Progetto IA Scuola - Forme Neon</title>
  
  <!-- Librerie stabili caricate via HTTPS sicuro -->
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background-color: #0c0c10;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; font-family: sans-serif; color: white;
      overflow: hidden;
    }
    #canvas-box {
      border: 4px solid #00ffcc; border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
    }
  </style>
</head>
<body>

  <div id="canvas-box"></div>

  <script>
    let video;
    let handPose;
    let hands = [];
    let iaPronta = false;

    function preload() {
      // Carica il modello nativo di ml5
      handPose = ml5.handPose();
    }

    function setup() {
      let canvas = createCanvas(640, 480);
      canvas.parent('canvas-box');
      
      // Avvia la webcam in modalità specchiata nativa (flipped)
      video = createCapture(VIDEO, { flipped: true });
      video.size(640, 480);
      video.hide();
      
      // Forza l'IA a cercare le mani nel video
      handPose.detectStart(video, gotHands);
    }

    function gotHands(results) {
      hands = results;
      iaPronta = true;
    }

    function draw() {
      // Schermata iniziale di caricamento
      if (!iaPronta) {
        background(20, 20, 28);
        fill(0, 255, 200);
        textSize(20);
        textAlign(CENTER, CENTER);
        text("Configurazione IA in corso... ⏳\n\nSe il browser lo chiede, premi 'Consenti' in alto!", width / 2, height / 2);
        return;
      }

      // Effetto scia neon psichedelico
      background(0, 0, 0, 25);
      
      // Disegna il video della webcam specchiato di sfondo
      image(video, 0, 0, width, height);

      // Se l'IA rileva le mani sul canvas
      if (hands.length > 0) {
        let coordinateMani = [];

        for (let i = 0; i < hands.length; i++) {
          let hand = hands[i];
          
          // Sintassi ufficiale ml5.js per la punta dell'indice
          let indice = hand.index_finger_tip; 
          
          if (indice) {
            coordinateMani.push({ x: indice.x, y: indice.y });

            // --- EFFETTO 1: Cerchi concentrici magici ---
            noFill();
            strokeWeight(4);
            colorMode(HSB);
            stroke((frameCount * 3 + i * 100) % 360, 90, 100); 
            
            for (let j = 1; j <= 3; j++) {
              let diametro = (frameCount * 4 + j * 35) % 160;
              ellipse(indice.x, indice.y, diametro, diametro);
            }
            colorMode(RGB);
          }
        }

        // --- EFFETTO 2: Se ci sono due mani, tiriamo le linee strane ---
        if (coordinateMani.length === 2) {
          stroke(0, 255, 230); // Celeste elettrico
          strokeWeight(3);
          
          let m1 = coordinateMani[0];
          let m2 = coordinateMani[1];

          for (let k = 0; k <= 10; k++) {
            let t = k / 10;
            let onda = sin(frameCount * 0.12 + k) * 55; 
            
            let startX = lerp(m1.x, m2.x, t) + onda;
            let startY = lerp(m1.y, m2.y, t) - onda;
            let endX = lerp(m1.x, m2.x, (k + 1) / 10) - onda;
            let endY = lerp(m1.y, m2.y, (k + 1) / 10) + onda;
            
            line(startX, startY, endX, endY);
          }
        }
      }
    }
  </script>
</body>
</html>
