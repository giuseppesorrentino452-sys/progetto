<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto IA Scuola</title>
  
  <!-- File ufficiali e sicuri di Google MediaPipe per tracciare i gesti delle mani -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #08080a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .interfaccia {
      position: absolute;
      top: 5%;
      text-align: center;
      z-index: 10;
      width: 100%;
    }
    h1 { font-size: 26px; margin: 0 0 5px 0; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,200,0.4); }
    p { margin: 0; color: #aaa; font-size: 14px; }
    
    /* PULSANTE GIGANTE IN PRIMO PIANO - IMPOSSIBILE DA COMPRIMERE */
    #btn-avvia {
      position: absolute;
      z-index: 999;
      background: #00ffaa;
      color: #000;
      font-size: 22px;
      font-weight: bold;
      padding: 25px 60px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0,255,170,0.5);
      letter-spacing: 1px;
      transition: transform 0.2s;
    }
    #btn-avvia:hover { transform: scale(1.05); }
    
    /* Schermata video fluida adattiva a tutto schermo */
    .schermo-video {
      position: relative;
      width: 640px;
      height: 480px;
      background: #111116;
      border: 4px solid #00ffcc;
      border-radius: 16px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #webcam, #output {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      object-fit: cover;
      transform: scaleX(-1); /* Specchia l'immagine per renderla naturale */
    }
    #output { z-index: 2; }
    #caricamento {
      position: absolute;
      color: #00ffcc;
      font-size: 20px;
      font-weight: bold;
      display: none;
      z-index: 5;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="interfaccia">
    <h1>IA DETEZIONE MANI - PROGETTO SCUOLA 🖐️</h1>
    <p>Attiva lo schermo, consenti l'uso della fotocamera e posiziona le mani</p>
  </div>

  <!-- Il pulsantone verde si sovrappone visivamente al centro di tutto -->
  <button id="btn-avvia" onclick="faiPartireWebcam()">ACCENDI WEBCAM</button>

  <div class="schermo-video">
    <div id="caricamento">Configurazione Intelligenza Artificiale... ⏳</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const btnAvvia = document.getElementById('btn-avvia');
    const txtCaricamento = document.getElementById('caricamento');

    canvas.width = 640;
    canvas.height = 480;

    // Configurazione dell'algoritmo di IA di Google MediaPipe
    const hands = new Hands({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      txtCaricamento.style.display = "none";
      
      // Effetto persistenza scia neon psichedelica
      ctx.fillStyle = "rgba(8, 8, 10, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        let puntiMani = [];

        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];
          
          // Punto 8: coordinate spaziali della punta del dito indice
          const x = landmarks.x * canvas.width;
          const y = landmarks.y * canvas.height;
          puntiMani.push({ x: x, y: y });

          // EFFETTO 1: Onde concentriche al neon arcobaleno
          let tempo = Date.now() * 0.004;
          ctx.lineWidth = 4;
          for (let j = 1; j <= 3; j++) {
            let raggio = ((tempo * 22 + j * 35) % 80);
            ctx.beginPath();
            ctx.arc(x, y, raggio, 0, 2 * Math.PI);
            ctx.strokeStyle = `hsl(${(tempo * 15 + j * 40) % 360}, 100%, 60%)`;
            ctx.stroke();
          }
        }

        // EFFETTO 2: Se compaiono ENTRAMBE le mani, le collega con una rete magnetica elastica
        if (puntiMani.length === 2) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#00ffff'; 
          let oscillazione = Math.sin(Date.now() * 0.006) * 60;

          ctx.beginPath();
          ctx.moveTo(puntiMani[0].x, puntiMani[0].y);
          ctx.bezierCurveTo(
            puntiMani[0].x + oscillazione, puntiMani[0].y - oscillazione,
            puntiMani[1].x - oscillazione, puntiMani[1].y + oscillazione,
            puntiMani[1].x, puntiMani[1].y
          );
          ctx.stroke();
        }
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    });

    // Funzione ad innesco immediato forzato al clic dell'utente
    async function faiPartireWebcam() {
      btnAvvia.style.display = "none";
      txtCaricamento.style.display = "block";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        
        const camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 640,
          height: 480
        });
        camera.start();
      } catch (err) {
        alert("Errore fotocamera: abilita i permessi nel browser o chiudi software che occupano la webcam!");
        btnAvvia.style.display = "block";
        txtCaricamento.style.display = "none";
      }
    }
  </script>
</body>
</html>
