<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto IA Scuola - Forme Automatiche</title>
  
  <!-- Caricamento delle librerie stabili via HTTPS per sbloccare la webcam -->
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background-color: #08080c;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; font-family: sans-serif; color: white;
      overflow: hidden;
    }
    #canvas-box {
      border: 4px solid #00ffcc; /* Bordo neon turchese */
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 255, 200, 0.25);
    }
  </style>
</head>
<body>

  <!-- Schermo dove si vedrà la webcam e l'effetto -->
  <div id="canvas-box"></div>

  <script>
    let video;
    let handPose;
    let hands = [];
    let iaPronta = false;

    // 1. Carica l'algoritmo di tracciamento in background
    function preload() {
      handPose = ml5.handPose();
    }

    // 2. Questa funzione scatta all'istante all'apertura del sito
    function setup() {
      let canvas = createCanvas(640, 480);
      canvas.parent('canvas-box');
      
      // FORZATURA WEBCAM: Chiede subito i permessi al browser all'avvio della pagina
      video = createCapture(VIDEO, { flipped: true });
      video.size(640, 480);
      video.hide(); // Nasconde l'inquadratura originale per disegnarci sopra gli effetti
      
      // Avvia la scansione automatica delle mani
      handPose.detectStart(video, gotHands);
    }

    // 3. Riceve i dati geometrici delle dita
    function gotHands(results) {
      hands = results;
      iaPronta = true;
    }

    // 4. Disegna gli effetti continui sullo schermo
    function draw() {
      // Finché l'utente non accetta la webcam o l'IA si sta configurando
      if (!iaPronta) {
        background(15, 15, 22);
        fill(0, 255, 200);
        textSize(20);
        textAlign(CENTER, CENTER);
        text("ATTIVAZIONE WEBCAM... ⏳\n\nClicca su 'Consenti' nel fumetto in alto!", width / 2, height / 2);
        return;
      }

      // Sfondo nero semitrasparente (Crea l'effetto scia luminosa)
      background(0, 0, 0, 25);
      
      // Mostra la webcam specchiata come sfondo del canvas
      image(video, 0, 0, width, height);

      // Se l'intelligenza artificiale rileva le mani
      if (hands.length > 0) {
        let coordinateMani = [];

        for (let i = 0; i < hands.length; i++) {
          let mano = hands[i];
          let indice = mano.index_finger_tip; // Identifica la punta del dito indice
          
          if (indice) {
            coordinateMani.push({ x: indice.x, y: indice.y });

            // --- EFFETTO 1: Cerchi concentrici psichedelici arcobaleno ---
            noFill();
            strokeWeight(4);
            colorMode(HSB); // Attiva lo spettro dei colori arcobaleno
            stroke((frameCount * 3 + i * 120) % 360, 90, 100); 
            
            for (let j = 1; j <= 3; j++) {
              let diametro = (frameCount * 4 + j * 35) % 160;
              ellipse(indice.x, indice.y, diametro, diametro);
            }
            colorMode(RGB); // Ritorna ai colori standard
          }
        }

        // --- EFFETTO 2: Se inquadri ENTRAMBE le mani, si collegano con forme strane ---
        if (coordinateMani.length === 2) {
          stroke(0, 255, 230); // Splendido azzurro elettrico neon
          strokeWeight(3);
          
          let m1 = coordinateMani[0];
          let m2 = coordinateMani[1];

          // Genera una ragnatela di 10 onde geometriche elastiche tese tra le due mani
          for (let k = 0; k <= 10; k++) {
            let t = k / 10;
            let oscillazione = sin(frameCount * 0.12 + k) * 55; 
            
            let startX = lerp(m1.x, m2.x, t) + oscillazione;
            let startY = lerp(m1.y, m2.y, t) - oscillazione;
            let endX = lerp(m1.x, m2.x, (k + 1) / 10) - oscillazione;
            let endY = lerp(m1.y, m2.y, (k + 1) / 10) + oscillazione;
            
            line(startX, startY, endX, endY);
          }
        }
      }
    }
  </script>
</body>
</html>
