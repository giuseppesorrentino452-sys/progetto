<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Progetto IA Scuola</title>
  
  <!-- Carichiamo p5.js e ml5.js ufficiali e leggeri dalle sorgenti sicure -->
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background-color: #0f0f14;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; font-family: sans-serif; color: white;
      overflow: hidden;
    }
    #canvas-container {
      border: 4px solid #00ffcc; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 255, 210, 0.3);
    }
  </style>
</head>
<body>

  <!-- Box dove verrà inserito lo schermo del progetto -->
  <div id="canvas-container"></div>

  <script>
    let video;
    let handPose;
    let hands = [];
    let iaPronta = false;

    // 1. Carichiamo l'Intelligenza Artificiale
    function preload() {
      handPose = ml5.handPose();
    }

    // 2. Impostiamo lo schermo del progetto e la webcam
    function setup() {
      let canvas = createCanvas(640, 480);
      canvas.parent('canvas-container'); // Inserisce il disegno dentro il nostro box fisso
      
      // Accendiamo la webcam in modalità specchiata (flipped: true) per renderla naturale
      video = createCapture(VIDEO, { flipped: true });
      video.size(640, 480);
      video.hide(); // Nascondiamo il video grezzo per poterci disegnare sopra
      
      // Diciamo all'IA di iniziare a cercare continuamente le mani nel video
      handPose.detectStart(video, gotHands);
    }

    // 3. Questa funzione si attiva da sola ogni volta che l'IA vede le mani
    function gotHands(results) {
      hands = results;
      iaPronta = true; // Il modello ha risposto ed è attivo!
    }

    // 4. Ciclo grafico continuo a 60 fotogrammi al secondo
    function draw() {
      // Se l'IA sta ancora caricando i file in background, mostra la schermata d'attesa
      if (!iaPronta) {
        background(20, 20, 30);
        fill(255);
        textSize(18);
        textAlign(CENTER, CENTER);
        text("Sto configurando l'IA delle mani... ⏳\n\nFai click su 'Consenti' in alto se compare il fumetto!", width / 2, height / 2);
        return;
      }

      // Effetto "scia neon": uno sfondo nero trasparente che lascia le tracce dei movimenti
      background(0, 0, 0, 25);
      
      // Disegna il video catturato dalla webcam come sfondo del nostro schermo
      image(video, 0, 0, width, height);

      // Se l'IA rileva almeno una mano...
      if (hands.length > 0) {
        let coordinateTrovate = [];

        // Ciclo su tutte le mani inquadrate (fino a un massimo di 2)
        for (let i = 0; i < hands.length; i++) {
          let mano = hands[i];
          
          // Leggiamo la coordinata della punta del dito indice (sintassi ufficiale ml5.js)
          let puntaDito = mano.index_finger_tip;
          
          if (puntaDito) {
            // Salviamo la posizione della mano per usarla dopo nell'effetto 2
            coordinateTrovate.push({ x: puntaDito.x, y: puntaDito.y });

            // --- EFFETTO 1: Cerchi psichedelici arcobaleno ---
            noFill();
            strokeWeight(4);
            colorMode(HSB); // Modalità colore cangiante sfumata
            stroke((frameCount * 3 + i * 120) % 360, 85, 100); 
            
            // Disegna 3 cerchi concentrici che si espandono continuamente sul tuo dito
            for (let j = 1; j <= 3; j++) {
              let diametro = (frameCount * 4 + j * 35) % 150;
              ellipse(puntaDito.x, puntaDito.y, diametro, diametro);
            }
            colorMode(RGB); // Ripristina i colori normali
          }
        }

        // --- EFFETTO 2: Se ci sono DUE mani, uniscile con onde elastiche strane ---
        if (coordinateTrovate.length === 2) {
          stroke(0, 255, 230); // Splendido colore celeste neon brillante
          strokeWeight(3);
          
          let m1 = coordinateTrovate[0];
          let m2 = coordinateTrovate[1];

          // Disegna una ragnatela di 10 linee oscillanti tese tra le tue mani
          for (let k = 0; k <= 10; k++) {
            let t = k / 10;
            let oscillazione = sin(frameCount * 0.12 + k) * 55; 
            
            let startX = lerp(m1.x, m2.x, t) + oscillazione;
            let startY = lerp(m1.y, m2.y, t) - oscillazione;
            let endX = lerp(m1.x, m2.x, (k + 1) / 10) - oscillazione;
            let endY = lerp(m1.y, m2.y, (k + 1) / 10) + oscillazione;
            
            line(startX, startY, endX, endY);
          }
        }
      }
    }
  </script>
</body>
</html>
